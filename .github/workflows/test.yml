on: [push]

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    name: Test Linux
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./ # Uses an action in the root directory
        id: setup
        with:
          version: '9.32.3'

  test-linux-container:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/dotnet/sdk:9.0
    name: Test Linux Container
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./ # Uses an action in the root directory
        id: setup
        with:
          version: '9.32.3'

  test-linux-packages:
    runs-on: ubuntu-24.04
    name: Test Linux (Packages)
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./ # Uses an action in the root directory
        id: setup
        with:
          version: '9.32.3'
          packages: 'Demonstration,PackagePublish:rc,TUI:any'

  test-win:
    runs-on: windows-2022
    name: Test Windows
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./ # Uses an action in the root directory
        id: setup
        with:
          version: '9.17.0'    

  test-macos:
    runs-on: macos-14
    name: Test MacOS
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./ # Uses an action in the root directory
        id: setup
        with:
          version: '9.33.0'

  test-macos-packages:
    runs-on: macos-14
    name: Test MacOS (Packages)
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./ # Uses an action in the root directory
        id: setup
        with:
          version: '9.33.0'
          packages: 'Runner,TUI:any'

  test-user-token:
    runs-on: ubuntu-24.04
    name: Test Installing Private Packages
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./ # Uses an action in the root directory
        id: setup
        with:
          version: '9.22.0-beta.1'
          packages: 'Sign,Dotfuscator,DocumentationGeneration'
          additional-repository: 'https://test-automation.pw.keysight.com/api/packages'
          token: ${{ secrets.OPENTAP_USERTOKEN }}

  test-additional-user-token:
    runs-on: ubuntu-24.04
    name: Test Installing Private Packages 2
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./ # Uses an action in the root directory
        id: setup
        with:
          version: 9.23.0
          packages: 'DocumentationGeneration:1.0.2'
          additional-repository: 'https://internal.automation.keysight.com/api/repository'
          additional-repository-token: '${{ secrets.KS8500_REPO_TOKEN }}'
      - run: tap package list --version any | grep '^Sign'

  test-packages-with-spaces:
    runs-on: ubuntu-24.04
    name: Test Packages With Spaces In Names
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./ # Uses an action in the root directory
        id: setup
        with:
          version: '9.21.0'
          packages: 'Editor X:1.5.0-beta.41+2c6d736c,NATS Server,CSV'

  test-install-path:
    runs-on: ubuntu-24.04
    name: Test Install Path Output
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./ # Uses an action in the root directory
        id: setup
        with:
          version: '9.32.3'
      - name: Verify path output is under RUNNER_TEMP and tap is installed there
        run: |
          echo "setup path output: '$TAP_PATH'"
          if [ -z "$TAP_PATH" ]; then
            echo "::error::path output was not set"
            exit 1
          fi
          case "$TAP_PATH" in
            "$RUNNER_TEMP"/*) : ;;
            *) echo "::error::install path is not under RUNNER_TEMP ($RUNNER_TEMP)"; exit 1 ;;
          esac
          test -x "$TAP_PATH/tap" || { echo "::error::tap not found at TAP_PATH"; exit 1; }
          # tap should also be resolvable via PATH (added by core.addPath)
          tap package list --installed
